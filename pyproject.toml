[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-inference"
version = "0.1.0"
description = "Robust Matched Filtering and Bayesian Parameter Estimation for Compact Binary Gravitational-Wave Signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "h5py>=3.10.0",
    "certifi>=2024.0.0",
    "matplotlib>=3.8.0",
]
sampling = [
    "dynesty>=2.1.0",
]
lab = [
    "streamlit>=1.67.0,<1.68.0",
    "plotly>=7.1.0,<8.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "scipy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"
